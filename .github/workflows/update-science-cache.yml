name: Update science cache

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-science-cache
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Update cache
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/update-science-cache.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "bcc-science-bot"
          git config user.email "bot@users.noreply.github.com"
          git add static/data/arxiv.json static/data/nasa-apod.json
          git commit -m "chore: update science cache"
          # Other workflows push to main too; rebase and retry on race.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
