<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="55 80 570 325"
  fill="none"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Microscopía computacional: referencia, análisis y defecto detectado</title>
  <desc id="desc">
    Escena SVG de análisis celular computacional con tres estados:
    una célula normal de referencia, una célula bajo análisis con modelo geométrico cohesivo,
    y una célula defectuosa detectada con un pequeño panel analítico.
  </desc>

  <style>
    :root{
      --blue-0:#f6faf8;
      --blue-1:#d9e8e2;
      --blue-2:#b8cdc5;
      --blue-3:#73938c;
      --blue-4:#3f6f69;
      --blue-5:#294f4c;

      --coral-0:#fcf4f0;
      --coral-1:#e3c0b2;
      --coral-2:#a8634e;
      --coral-3:#7e4335;

      --ink-0:#c7d7d1;
      --ink-1:#96aea5;
      --ink-2:#66817e;
      --ink-3:#30464a;

      --soft-blue:rgba(63,111,105,.16);
      --soft-coral:rgba(168,99,78,.16);

      --line-blue:rgba(63,111,105,.80);
      --line-coral:rgba(168,99,78,.86);

      --pipeline:rgba(102,129,126,.38);

      --panel-fill:rgba(255,255,255,.91);
      --panel-stroke:rgba(48,70,74,.18);
    }

    .pipeline{
      fill:none;
      stroke:var(--pipeline);
      stroke-width:2.5;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:3 10;
    }

    .cell-normal{
      fill:url(#cell-normal-fill);
      stroke:var(--blue-2);
      stroke-width:2.6;
      filter:url(#shadow-blue);
    }

    .cell-defect{
      fill:url(#cell-defect-fill);
      stroke:var(--coral-1);
      stroke-width:2.6;
      filter:url(#shadow-coral);
    }

    .nucleus-normal{
      fill:url(#nucleus-normal-fill);
      fill-opacity:.56;
      stroke:var(--blue-4);
      stroke-opacity:.17;
      stroke-width:1.5;
    }

    .nucleus-defect{
      fill:url(#nucleus-defect-fill);
      fill-opacity:.55;
      stroke:var(--coral-2);
      stroke-opacity:.20;
      stroke-width:1.5;
    }

    .cell-fiber{
      fill:none;
      stroke-linecap:round;
      stroke-width:1.15;
    }

    .cell-fiber.normal{ stroke:rgba(255,255,255,.24); }
    .cell-fiber.defect{ stroke:rgba(255,248,244,.23); }
    .cell-membrane{ fill:none; stroke-width:.9; stroke-linecap:round; stroke-linejoin:round; }
    .cell-membrane.normal{ stroke:rgba(63,111,105,.14); }
    .cell-membrane.defect{ stroke:rgba(126,67,53,.16); }
    .cell-speck.normal{ fill:rgba(63,111,105,.13); }
    .cell-speck.defect{ fill:rgba(168,99,78,.13); }

    .contour-soft{
      fill:none;
      stroke-width:11;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .contour-soft.normal{
      stroke:var(--soft-blue);
    }

    .contour-soft.defect{
      stroke:var(--soft-coral);
    }

    .contour-trace{
      fill:none;
      stroke-width:1.55;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:none;
    }

    .contour-trace.normal{
      stroke:var(--line-blue);
      opacity:.52;
    }

    .contour-trace.defect{
      stroke:var(--line-coral);
      animation-duration:5.1s;
      opacity:.58;
    }

    .pulse{
      transform-origin:center;
      transform-box:fill-box;
    }

    .analysis-model{
      opacity:1;
    }

    .fit-ellipse{
      fill:none;
      stroke:rgba(63,111,105,.26);
      stroke-width:1.7;
      stroke-dasharray:5 5;
    }

    .measure-line{
      stroke:rgba(63,111,105,.50);
      stroke-width:2.2;
      stroke-linecap:round;
    }

    .measure-line.soft{
      stroke:rgba(63,111,105,.30);
      stroke-width:1.6;
      stroke-dasharray:4 5;
    }

    .measure-node{
      fill:#ffffff;
      stroke:var(--blue-4);
      stroke-width:1.8;
    }

    .landmark{
      fill:#ffffff;
      stroke:rgba(63,111,105,.84);
      stroke-width:1.5;
    }

    .centroid{
      fill:var(--blue-4);
      stroke:#ffffff;
      stroke-width:1.4;
    }

    .hotspot-ring{
      fill:none;
      stroke:var(--coral-2);
      stroke-width:2.5;
      stroke-linecap:round;
      stroke-dasharray:4 4;
    }

    .hotspot-fill{
      fill:rgba(186,122,98,.08);
      stroke:none;
    }

    .hotspot-landmark{
      fill:#ffffff;
      stroke:var(--coral-2);
      stroke-width:2;
    }

    .hotspot-core{
      fill:var(--coral-2);
      stroke:#ffffff;
      stroke-width:1.4;
    }

    .panel{
      fill:var(--panel-fill);
      stroke:var(--panel-stroke);
      stroke-width:1.5;
      filter:url(#panel-shadow);
    }

    .panel-title{
      font:600 13px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      fill:var(--ink-3);
      letter-spacing:.1px;
    }

    .panel-label{
      font:500 11px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      fill:var(--ink-2);
    }

    .panel-value{
      font:700 11px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      fill:var(--ink-3);
    }

    .panel-value.alert{
      fill:var(--coral-2);
    }

    .panel-divider{
      stroke:rgba(48,70,74,.14);
      stroke-width:1;
    }

    .badge{
      fill:rgba(168,99,78,.10);
      stroke:rgba(168,99,78,.28);
      stroke-width:1;
    }

    .badge-text{
      font:700 10px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      fill:var(--coral-2);
      letter-spacing:.2px;
    }

    .callout{
      fill:none;
      stroke:rgba(168,99,78,.50);
      stroke-width:2;
      stroke-linecap:round;
      stroke-dasharray:4 5;
    }

    .callout-dot{
      fill:var(--coral-2);
    }

    .micro-label{
      font:600 10.5px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      fill:var(--ink-2);
      letter-spacing:.15px;
    }

    @media (prefers-reduced-motion: reduce){
      .pulse,
      .contour-trace,
      .pipeline,
      .hotspot-ring{
        animation:none !important;
      }
    }
  </style>

  <defs>
    <radialGradient id="cell-normal-fill" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f6faf8"/>
      <stop offset="60%" stop-color="#d9e8e2"/>
      <stop offset="100%" stop-color="#b8cdc5"/>
    </radialGradient>

    <radialGradient id="cell-defect-fill" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#fcf4f0"/>
      <stop offset="64%" stop-color="#e3c0b2"/>
      <stop offset="100%" stop-color="#a8634e"/>
    </radialGradient>

    <radialGradient id="nucleus-normal-fill" cx="36%" cy="29%" r="78%">
      <stop offset="0%" stop-color="#e9f2ef"/>
      <stop offset="60%" stop-color="#9db9b1"/>
      <stop offset="100%" stop-color="#66847d"/>
    </radialGradient>

    <radialGradient id="nucleus-defect-fill" cx="36%" cy="29%" r="78%">
      <stop offset="0%" stop-color="#f8eae3"/>
      <stop offset="60%" stop-color="#d4a18f"/>
      <stop offset="100%" stop-color="#9a5947"/>
    </radialGradient>

    <filter id="shadow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#8eaaa1" flood-opacity=".18"/>
    </filter>

    <filter id="shadow-coral" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#a8634e" flood-opacity=".18"/>
    </filter>

    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3f6f69" flood-opacity=".11"/>
    </filter>

    <path id="cell-reference-shape" d="
      M140 150
      C178 148 212 173 219 205
      C228 244 204 278 165 285
      C125 293 89 272 78 239
      C67 205 82 170 114 157
      C122 153 131 151 140 150 Z" />

    <path id="cell-analysis-shape" d="
      M310 252
      C343 250 373 270 378 300
      C384 333 360 361 326 364
      C287 367 253 343 247 312
      C240 280 268 255 310 252 Z" />

    <path id="cell-defect-shape" d="
      M490 130
      C535 130 567 160 573 196
      C578 228 561 258 533 271
      C518 278 503 282 489 280
      C474 279 462 274 452 265
      C444 258 437 250 428 249
      C418 248 409 245 403 238
      C396 230 393 219 394 206
      C396 175 420 145 455 135
      C466 132 478 130 490 130 Z" />

    <path id="defect-hotspot-region" d="
      M423 236
      C432 231 442 233 450 241
      C446 251 437 256 427 253
      C421 249 419 243 423 236 Z" />

    <clipPath id="reference-cell-clip">
      <use href="#cell-reference-shape"/>
    </clipPath>

    <clipPath id="defect-cell-clip">
      <use href="#cell-defect-shape"/>
    </clipPath>
  </defs>

  <path
    d="M208 221
       C240 228 263 243 281 264
       C294 280 307 289 323 290
       C347 291 379 276 411 243
       C431 223 450 210 470 207"
    class="pipeline"
  />

  <g>
    <use href="#cell-reference-shape" class="contour-soft normal"/>
    <use href="#cell-reference-shape" class="contour-trace normal"/>

    <g class="pulse">
      <use href="#cell-reference-shape" class="cell-normal"/>
      <g clip-path="url(#reference-cell-clip)">
        <path d="M100 191C126 173 170 177 201 201" class="cell-fiber normal"/>
        <path d="M94 238C125 256 170 260 204 234" class="cell-fiber normal"/>
        <path d="M109 204C128 191 166 190 190 207" class="cell-membrane normal"/>
        <path d="M107 237C129 251 168 254 194 235" class="cell-membrane normal"/>
        <circle cx="117" cy="190" r="4" class="cell-speck normal"/>
        <circle cx="183" cy="200" r="3.2" class="cell-speck normal"/>
        <circle cx="177" cy="251" r="4.5" class="cell-speck normal"/>
        <circle cx="123" cy="252" r="2.8" class="cell-speck normal"/>
      </g>
      <path d="M114 214C120 195 139 186 159 190C178 193 190 207 187 224C184 241 165 250 145 248C127 247 109 233 114 214Z" class="nucleus-normal"/>
    </g>

    <text x="96" y="314" class="micro-label">Reference</text>
    <text x="96" y="329" class="panel-label">Normal morphology</text>
  </g>

  <g>
    <use href="#cell-analysis-shape" class="contour-soft normal"/>
    <use href="#cell-analysis-shape" class="contour-trace normal"/>

    <g class="pulse">
      <use href="#cell-analysis-shape" class="cell-normal"/>
      <ellipse cx="309" cy="307" rx="29" ry="22" class="nucleus-normal"/>
    </g>

    <g class="analysis-model">
      <ellipse
        cx="311"
        cy="309"
        rx="54"
        ry="38"
        transform="rotate(20 311 309)"
        class="fit-ellipse"
      />

      <line
        x1="260"
        y1="290"
        x2="362"
        y2="328"
        class="measure-line"
      />

      <path d="M277 281C290 268 316 264 336 277" class="measure-line soft"/>

      <line
        x1="334"
        y1="274"
        x2="288"
        y2="344"
        class="measure-line soft"
      />

      <circle cx="311" cy="309" r="5.5" class="centroid"/>
      <circle cx="260" cy="290" r="4.4" class="measure-node"/>
      <circle cx="362" cy="328" r="4.4" class="measure-node"/>
      <circle cx="334" cy="274" r="3.8" class="landmark"/>
      <circle cx="288" cy="344" r="3.8" class="landmark"/>
    </g>

    <text x="268" y="386" class="micro-label">Feature analysis</text>
  </g>

  <g>
    <use href="#cell-defect-shape" class="contour-soft defect"/>
    <use href="#cell-defect-shape" class="contour-trace defect"/>

    <g class="pulse">
      <use href="#cell-defect-shape" class="cell-defect"/>
      <g clip-path="url(#defect-cell-clip)">
        <path d="M441 183C467 162 514 160 548 182" class="cell-fiber defect"/>
        <path d="M458 229C485 247 524 250 552 230" class="cell-fiber defect"/>
        <path d="M446 194C465 174 499 170 530 185" class="cell-membrane defect"/>
        <path d="M454 221C480 237 519 235 543 215" class="cell-membrane defect"/>
        <circle cx="462" cy="172" r="3.4" class="cell-speck defect"/>
        <circle cx="534" cy="184" r="4.1" class="cell-speck defect"/>
        <circle cx="522" cy="243" r="3.1" class="cell-speck defect"/>
      </g>
      <path d="M453 202C456 182 474 164 496 165C518 167 532 182 531 201C530 218 514 232 493 232C472 232 450 221 453 202Z" class="nucleus-defect"/>

      <use href="#defect-hotspot-region" class="hotspot-fill"/>

      <path
        d="M423 236
           C432 231 442 233 450 241
           C446 251 437 256 427 253
           C421 249 419 243 423 236 Z"
        class="hotspot-ring"
      />

      <circle cx="429" cy="240" r="3.5" class="hotspot-landmark"/>
      <circle cx="444" cy="242" r="3.5" class="hotspot-landmark"/>
      <circle cx="435" cy="249" r="3.5" class="hotspot-landmark"/>
      <circle cx="435" cy="244" r="2.7" class="hotspot-core"/>
    </g>

    <rect x="444" y="97" width="98" height="24" rx="12" class="badge"/>
    <text x="493" y="112.5" text-anchor="middle" class="badge-text">DEFECT DETECTED</text>
  </g>

  <g>
    <path d="M450 244 C472 242 489 247 503 258" class="callout"/>
    <circle cx="450" cy="244" r="4" class="callout-dot"/>

    <rect x="416" y="262" width="182" height="116" rx="16" class="panel"/>

    <text x="434" y="286" class="panel-title">Morphology report</text>
    <line x1="434" y1="296" x2="580" y2="296" class="panel-divider"/>

    <text x="434" y="317" class="panel-label">Contour</text>
    <text x="580" y="317" text-anchor="end" class="panel-value">Detected</text>

    <text x="434" y="336" class="panel-label">Circularity</text>
    <text x="580" y="336" text-anchor="end" class="panel-value alert">Low</text>

    <text x="434" y="355" class="panel-label">Defect score</text>
    <text x="580" y="355" text-anchor="end" class="panel-value alert">0.87</text>

    <text x="434" y="374" class="panel-label">Status</text>
    <text x="580" y="374" text-anchor="end" class="panel-value alert">Irregular edge</text>
  </g>
</svg>
